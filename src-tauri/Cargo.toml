[package]
name = "hoyland"
version = "1.6.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.4.0", features = [] }

[dependencies]
# Only core tauri is used (Window::emit, Manager, State, generate_handler, WindowEvent,
# on_window_event); none of those are allowlist-gated, so no api-all feature is needed.
tauri = { version = "1.4.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.0.0"
lazy_static = "1.4.0"
log = "0.4"
env_logger = "0.10.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
